services:
  db:
    image: mysql:8.0
    container_name: toki_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wpuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wppassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - ./docker/02-init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    networks:
      - wp_network

  wordpress:
    build: .
    container_name: toki_wp_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-wordpress}
      DB_USER: ${DB_USER:-wpuser}
      DB_PASSWORD: ${DB_PASSWORD:-wppassword}
    depends_on:
      - db
    networks:
      - wp_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: toki_wp_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - wp_network

volumes:
  db_data:

networks:
  wp_network:
    driver: bridge
